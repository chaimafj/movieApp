<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="photo-picker" (click)="capture()">
    <ion-avatar class="big-avatar">
      @if (photo(); as p) {
        <img [src]="p" alt="Photo de profil" />
      } @else {
        <div class="avatar-placeholder"><ion-icon name="camera"></ion-icon></div>
      }
    </ion-avatar>
    <ion-button fill="outline" size="small">
      <ion-icon slot="start" name="camera"></ion-icon>
      {{ photo() ? 'Reprendre la photo' : 'Prendre une photo' }}
    </ion-button>
  </div>

  <form (ngSubmit)="register()">
    <ion-list>
      <ion-item>
        <ion-input label="Nom" labelPlacement="floating" name="nom" [(ngModel)]="nom" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Prénom" labelPlacement="floating" name="prenom" [(ngModel)]="prenom" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Âge" labelPlacement="floating" type="number" name="age" min="1" max="120"
          [(ngModel)]="age" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Email" labelPlacement="floating" type="email" name="email" autocomplete="email"
          [(ngModel)]="email" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Mot de passe (6 car. min.)" labelPlacement="floating" type="password" name="password"
          autocomplete="new-password" [(ngModel)]="password" required>
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading()">
      @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else { S'inscrire }
    </ion-button>
  </form>
</ion-content>
