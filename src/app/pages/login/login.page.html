<ion-header>
  <ion-toolbar color="primary">
    <ion-title>MovieMatch – Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="logo">🎬</div>

  @if (!configured) {
    <ion-text color="danger">
      <p>
        Firebase n'est pas configuré : renseignez <code>src/environments/environment.ts</code>
        (voir README).
      </p>
    </ion-text>
  }

  <form (ngSubmit)="login()">
    <ion-list>
      <ion-item>
        <ion-input label="Email" labelPlacement="floating" type="email" name="email"
          autocomplete="email" [(ngModel)]="email" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Mot de passe" labelPlacement="floating" type="password" name="password"
          autocomplete="current-password" [(ngModel)]="password" required>
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading()">
      @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else { Se connecter }
    </ion-button>
  </form>

  <ion-button expand="block" fill="clear" routerLink="/register">Créer un compte</ion-button>
  <ion-note class="ion-text-center" style="display:block">
    Les comptes désactivés par l'administrateur ne peuvent plus se connecter.
  </ion-note>
</ion-content>
